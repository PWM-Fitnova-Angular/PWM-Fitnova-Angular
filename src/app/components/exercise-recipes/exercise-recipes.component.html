<body [ngClass]="bodyClass">
<header id="header"></header>

<div class="exercise-content">
  <section class="horizontal-filters">
    <div class="filter-box"
         *ngFor="let item of mainItems let i = index"
          (click)="topFilter(item)"
          [class.active]="topFilterActive === item"
    >
      <span class="icon"><i class="fas" [ngClass]="mainIcons[i]"></i></span>
      <span>{{ item }}</span>
    </div>
  </section>

  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-item" *ngFor="let side of sideItems; let i = index">
        <span class="icon"><i class="fas" [ngClass]="sideIcons[i]"></i></span>
        <span>{{ side }}</span>
      </div>
    </aside>

    <main class="content">
      <h2>{{ title }}</h2>
      <div id="grid" class="grid">
        <ng-container *ngIf="cardItems.length > 0">
          <app-exercise-recipe-card
            *ngFor="let item of cardItems"
            [cardLabel]="item.type"
            [cardTitle]="item.name"
            [cardImage]="item.imageUrl"
            [cardObject]="item">

          </app-exercise-recipe-card>
        </ng-container>
      </div>
    </main>
  </div>
</div>

<footer id="footer"></footer>
</body>
