<body class="profile-body">
<main class="container">
  <div class="profile-settings">
    <section class="user-profile-image">
      <img class="user-profile-image" src="app/assets/img/Profile.jpg">
    </section>
    <article class="user-profile-options">
      <div class="user-profile-grid">
        <button class="user-profile-card-button" [routerLink]="['/settings']">Settings</button>
        <button class="user-profile-card-button" [routerLink]="['/saved progress']">SavedRecipes </button>
        <button class="user-profile-card-button" [routerLink]="['/saved progress']">Workout Progress</button>
        <button class="user-profile-card-button">Profile</button>
        <button class="user-profile-card-button">Posts</button>
        <button class="user-profile-card-button" (click)="logout()">Log Out</button>
      </div>
    </article>
  </div>
</main>
</body>
