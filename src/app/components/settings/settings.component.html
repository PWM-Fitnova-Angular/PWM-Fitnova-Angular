<body>
<header id="header"></header>
<main class="setting-container">
  <div class="cont">
    <label class="mode-label">Dark Mode</label>
    <input type="checkbox" id="dark-mode" class="mode" [(ngModel)]="darkMode">
  </div>
  <div class="cont">
    <fieldset>
      <legend class="mode-label">Profile</legend>
      <label for="public">Public</label>
      <input type="radio" id="public" name="profile" value="public" [(ngModel)]="privacySetting">
      <label for="private">Private</label>
      <input type="radio" id="private" name="profile" value="private" [(ngModel)]="privacySetting">
    </fieldset>
  </div>
  <div class="cont">
    <fieldset>
      <legend class="mode-label">Email notification</legend>
      <label for="yes">Yes</label>
      <input type="radio" id="yes" name="notify" value="yes" [(ngModel)]="notificationsEnabled">
      <label for="no">No</label>
      <input type="radio" id="no" name="notify" value="no"[(ngModel)]="notificationsEnabled">
    </fieldset>
  </div>
  <div class="cont">
    <label class="mode-label" for="language">Choose your language:</label>
    <input list="language" name="language" id="langu" [(ngModel)]="language">
    <datalist id="language">
      <option value="Spanish">
      <option value="English">
    </datalist>
  </div>
  <div class="cont">
    <fieldset>
      <legend class="mode-label">Change Password</legend>
      <label class="mode-label" for="old-password" >Old Password</label>
      <input type="password" id="old-password" name="old-password" [(ngModel)]="oldPassword">
      <label class = "mode-label" for="new-password">New Password</label>
      <input type="password" id="new-password" name="new-password" [(ngModel)]="newPassword">
      <label class = "mode-label" for="confirm-password">Confirm New Password</label>
      <input type="password" id="confirm-password" name="confirm-password" [(ngModel)]="confirmPassword">
      <button type="button" class="change-button" (click)="changeUserPassword()">Change</button>
      <div id="password-message" class="message"></div>
    </fieldset>
  </div>
  <div class="but">
    <button class="delete-button" (click)="saveSettings()">Save Settings</button>
    <a [routerLink]="['/delete']" class="delete-button">Delete Account</a>
  </div>

</main>

</body>
