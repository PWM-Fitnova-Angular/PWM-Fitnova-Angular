<div class="card">
  <input
    type="file"
    #fileInput
    style="display: none;"
    accept="image/*"
    (change)="onFileSelected($event)"
  >

  <a routerLink="/details" class="card-link">
    <div class="card-label">{{ cardLabel }}</div>

    <div class="image-grid" [ngClass]="{'edit-mode': isEditMode}">
      <img [src]="imagePreview" alt="" class="card-image">

      <div class="image-overlay" *ngIf="isEditMode">
        <div class="overlay-content">
          <div class="camera-icon">
            <i class="fas fa-camera"></i>
            <span>Click para subir imagen</span>
          </div>

          <div class="overlay-actions" *ngIf="selectedFile">
            <button
              class="action-btn save-btn"
              [disabled]="isUploading"
              (click)="uploadImage($event)"
            >
              <i class="fas fa-check"></i> Guardar
            </button>
            <button
              class="action-btn cancel-btn"
              [disabled]="isUploading"
              (click)="cancelEdit($event)"
            >
              <i class="fas fa-times"></i> Cancelar
            </button>
          </div>
        </div>

        <div class="loading-indicator" *ngIf="isUploading">
          <i class="fas fa-spinner fa-spin"></i> Subiendo...
        </div>
      </div>
    </div>

    <div class="card-title">{{ cardTitle }}</div>
    <div class="card-icon">🛈</div>
  </a>
</div>
