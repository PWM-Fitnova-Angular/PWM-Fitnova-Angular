<body>
<div class="progress-saved">
  <h2>My Saved Exercises</h2>
  <div *ngIf="loading">Loading exercises…</div>
  <div class="saved-grid" *ngIf="!loading && exercises.length">
    <div *ngFor="let ex of exercises" class="card-small" (click)="viewDetail(ex)">
      <div class="card-small-image">
        <img [src]="ex.imageUrl" alt="{{ ex.name }}">
      </div>
      <div class="card-small-content">
        <h3>{{ ex.name }}</h3>
        <p>{{ ex.description | slice:0:50 }}…</p>
      </div>
    </div>
  </div>
  <p *ngIf="!loading && !exercises.length">There are no saved exercises.</p>
</div>
</body>
