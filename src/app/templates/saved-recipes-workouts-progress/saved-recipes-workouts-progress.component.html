<body>
<div class="progress-saved">
  <h2>My Saved Recipes</h2>
  <div *ngIf="loading">Loading recipes…</div>
  <div class="saved-grid" *ngIf="!loading && recipes.length">
    <div *ngFor="let r of recipes" class="card-small" (click)="viewDetail(r)">
      <div class="card-small-image">
        <img [src]="r.imageUrl" alt="{{ r.name }}">
      </div>
      <div class="card-small-content">
        <h3>{{ r.name }}</h3>
        <p>{{ r.description | slice:0:50 }}…</p>
      </div>
    </div>
  </div>
  <p *ngIf="!loading && !recipes.length">There are no saved recipes.</p>
</div>
</body>
